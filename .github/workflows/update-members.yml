name: Update members

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-members
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-members.mjs
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          SEED_PLAYER_ID: '245188561'
      - run: |
          if git diff --quiet -- members.json && git ls-files --error-unmatch members.json >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add members.json
          git commit -m 'Update members'
          git push
