<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f2f2f7">
<title>集結計算機｜プリセット版プレビュー</title>
<link rel="stylesheet" href="preset-preview.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <button id="settingsBtn" class="icon-btn" type="button" aria-label="設定">…</button>
      <div class="utc-clock"><span id="utcClock">--:--:--</span><small>UTC</small></div>
    </header>

    <nav class="tabs" aria-label="モード">
      <button class="tab" data-page="castle">王城決戦</button>
      <button class="tab active" data-page="landing">着弾時刻</button>
      <button class="tab" data-page="switch">スイッチ</button>
    </nav>

    <section id="landing" class="page active">
      <div class="card">
        <div class="label">集結時間</div>
        <div id="landingPresetBar" class="preset-grid"></div>
      </div>

      <div class="card controls-card">
        <div class="control-row">
          <span>準備時間</span>
          <div class="stepper"><button type="button" data-step="prep" data-dir="-1">−</button><strong id="prepValue">55秒</strong><button type="button" data-step="prep" data-dir="1">＋</button></div>
        </div>
        <div class="control-row">
          <span>時差</span>
          <div class="stepper"><button type="button" data-step="diff" data-dir="-1">−</button><strong id="diffValue">0秒</strong><button type="button" data-step="diff" data-dir="1">＋</button></div>
        </div>
      </div>

      <button id="landingCalc" class="primary" type="button">計算開始</button>
      <div class="result"><span>着弾時刻</span><strong id="landingResult">--:--:--</strong><small>UTC</small></div>
    </section>

    <section id="castle" class="page">
      <div class="card">
        <div class="label">集結時間</div>
        <div id="castlePresetBar" class="preset-grid"></div>
      </div>
      <div class="card controls-card">
        <div class="control-row">
          <span>今から</span>
          <div class="stepper"><button type="button" data-step="fromNow" data-dir="-1">−</button><strong id="fromNowValue">30秒後</strong><button type="button" data-step="fromNow" data-dir="1">＋</button></div>
        </div>
      </div>
      <button id="castleCalc" class="primary" type="button">計算開始</button>
      <div class="result"><span>着弾時刻</span><strong id="castleResult">--:--:--</strong><small>UTC</small></div>
    </section>

    <section id="switch" class="page">
      <div class="card">
        <div class="label">基準の行軍時間</div>
        <div class="switch-value">55秒</div>
      </div>
      <div class="card">
        <div class="label">この画面は既存仕様をそのまま残す想定</div>
      </div>
    </section>

    <footer>© 1524_Off</footer>
  </main>

  <div id="settingsSheet" class="sheet-backdrop" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="sheet-head">
        <button id="settingsClose" class="text-btn" type="button">閉じる</button>
        <h2 id="settingsTitle">集結時間プリセット</h2>
        <button id="settingsSave" class="text-btn strong" type="button">保存</button>
      </div>
      <p class="sheet-note">よく使う時間を4つまで登録できます。</p>
      <div id="presetEditor" class="preset-editor"></div>
      <button id="resetPresets" class="secondary" type="button">初期値に戻す</button>
    </section>
  </div>

  <script src="preset-preview.js"></script>
</body>
</html>
